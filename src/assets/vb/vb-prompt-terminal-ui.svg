<svg viewBox="0 0 1100 825" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Menlo', 'Consolas', monospace">
  <rect width="1100" height="825" fill="#0D0D0D"/>

  <!-- window — centered vertically: y=122, height=580, center=412 -->
  <rect x="40" y="122" width="1020" height="580" rx="12" fill="#000000" stroke="#2A2A2A" stroke-width="1"/>

  <!-- title bar -->
  <rect x="40" y="122" width="1020" height="38" rx="12" fill="#151515"/>
  <rect x="40" y="148" width="1020" height="12" fill="#151515"/>
  <circle cx="66" cy="141" r="6" fill="#FF5F57"/>
  <circle cx="86" cy="141" r="6" fill="#FEBC2E"/>
  <circle cx="106" cy="141" r="6" fill="#28C840"/>
  <text x="550" y="145" font-size="12" fill="#8A8A8A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">claude — vancouver-balloons</text>

  <!-- prompt line 1 -->
  <text x="70" y="197" font-size="14" fill="#E8873A">&gt;</text>
  <text x="90" y="197" font-size="14" fill="#FFFFFF">In RoundArchSVG, add a prop called </text>
  <text x="366" y="197" font-size="14" fill="#E8BF5E">archSize</text>
  <text x="450" y="197" font-size="14" fill="#FFFFFF">(string). Based on archSize,</text>

  <text x="90" y="221" font-size="14" fill="#FFFFFF">change the SVG viewBox to control how wide and tall</text>
  <text x="90" y="245" font-size="14" fill="#FFFFFF">the arch appears:</text>

  <text x="90" y="277" font-size="13.5" fill="#9A9A9A">— "Skinny Door Arch": viewBox="150 10 310 500" </text>
  <text x="90" y="299" font-size="13.5" fill="#9A9A9A">— "Supreme Full Arch": viewBox="20 -30 660 560" </text>
  <text x="90" y="321" font-size="13.5" fill="#9A9A9A">— "Standard Full Arch" or default: viewBox="80 10 540 500"</text>

  <!-- response block -->
  <rect x="70" y="342" width="940" height="86" rx="8" fill="#111111" stroke="#262626" stroke-width="1"/>
  <text x="90" y="367" font-size="12" fill="#28C840" font-family="Helvetica, Arial, sans-serif">● Update(src/components/RoundArchSVG.jsx)</text>
  <text x="90" y="389" font-size="13" fill="#7A7A7A">Added archSize prop · 3 viewBox cases mapped</text>
  <text x="90" y="411" font-size="13" fill="#7A7A7A">Done. archSize now controls arch dimensions on render.</text>

  <!-- divider -->
  <line x1="70" y1="462" x2="1010" y2="462" stroke="#222222" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="540" y="458" font-size="11" fill="#5A5A5A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" letter-spacing="1">WAIT → REVIEW OUTPUT → CONTINUE</text>

  <!-- prompt line 2 -->
  <text x="70" y="500" font-size="14" fill="#E8873A">&gt;</text>
  <text x="90" y="500" font-size="14" fill="#FFFFFF">Pass the </text>
  <text x="168" y="500" font-size="14" fill="#E8BF5E">archSize</text>
  <text x="250" y="500" font-size="14" fill="#FFFFFF">prop to RoundArchSVG from Step3Size.jsx</text>

  <text x="90" y="524" font-size="14" fill="#FFFFFF">and all steps that show the arch preview (steps 4, 5, 6).</text>
  <text x="90" y="548" font-size="14" fill="#FFFFFF">Use the </text>
  <text x="153" y="548" font-size="14" fill="#E8BF5E">selectedSize</text>
  <text x="260" y="548" font-size="14" fill="#FFFFFF">state value as the archSize prop. Make sure</text>
  <text x="90" y="572" font-size="14" fill="#FFFFFF">it updates immediately when the user selects a different</text>
  <text x="90" y="596" font-size="14" fill="#FFFFFF">size on step 3.</text>

  <!-- response block 2 -->
  <rect x="70" y="617" width="940" height="60" rx="8" fill="#111111" stroke="#262626" stroke-width="1"/>
  <text x="90" y="640" font-size="12" fill="#28C840" font-family="Helvetica, Arial, sans-serif">● Update(4 files) — Steps 3–6 wired to archSize</text>
  <text x="90" y="662" font-size="13" fill="#7A7A7A">Done. Preview resizes immediately on size change.</text>
</svg>
